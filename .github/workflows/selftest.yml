name: selftest

# Windows is the platform the maintainer measured (163 checks, green and red paths).
# Python: 3.11 and 3.14 measured locally; the matrix runs 3.11 and 3.13 (3.11 caught one 3.12-only f-string).
# A Linux/macOS job is welcome as a pull request: the suite skips the cmd.exe tests there,
# but nobody has run it on Linux yet, so it is not claimed to pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: selftest (end to end, green and red paths)
        run: python -I -B selftest.py
      - name: kit-lint (every doc against the real command surface)
        run: python -I -B selftest.py --lint-only
      - name: the owner guides execute their own claims
        run: python dev/guide_claims.py
